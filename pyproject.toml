[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "md2docx-academic"
version = "0.1.0"
description = "Markdown to academic DOCX converter with native Word lists and ГОСТ-aware JSON styles"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "markdown-it-py>=3.0,<5",
    "mdit-py-plugins>=0.4,<0.6",
    "python-docx>=1.1,<2",
    "Pillow>=10,<13",
    "latex2mathml>=3.77,<4",
    "mathml2omml==0.0.2",
]

[project.scripts]
md2docx = "md2docx.cli:main"

[tool.setuptools]
packages = ["md2docx"]
