[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "md2docx-academic"
version = "0.1.0"
description = "Deterministic Markdown to academic DOCX converter driven by JSON styles"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["markdown-it-py>=3.0,<5", "python-docx>=1.1,<2", "Pillow>=10,<13"]

[project.scripts]
md2docx = "md2docx.cli:main"

[tool.setuptools]
packages = ["md2docx"]
